<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship — Play vs AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>⚓ Battleship</h1>
      <p class="subtitle">Place your fleet, then sink the AI before it sinks you.</p>
    </header>

    <main class="layout">
      <!-- Phase overlays -->
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 id="overlay-text"></h2>
        </div>
      </div>

      <!-- Transient battle flash (HIT! / ship sunk) -->
      <div id="flash-overlay" class="flash-overlay hidden">
        <div id="flash-content" class="flash-content">
          <span id="flash-text" class="flash-text"></span>
          <span id="flash-icon" class="flash-icon"></span>
        </div>
      </div>

      <!-- Status + main action button -->
      <section class="control-panel">
        <p id="status" class="status"></p>

        <div class="button-row">
          <button id="main-btn" type="button" class="btn-green">Place Ships</button>
        </div>

        <!-- Placement toolbar (rotate, random, clear) — shown only during placement -->
        <div id="placement-controls" class="placement-controls" style="display:none">
          <button id="rotate-btn" type="button">Rotate ship</button>
          <button id="random-btn" type="button">Random placement</button>
          <button id="clear-btn" type="button">Clear board</button>
        </div>
      </section>

      <!-- Boards area: shipyard | player board | enemy board | shipyard -->
      <section class="boards-area">
        <div id="player-shipyard" class="shipyard">
          <h3>Your Shipyard</h3>
          <ul id="player-shipyard-list" class="shipyard-list"></ul>
        </div>

        <div class="board-wrap">
          <h2>Your Fleet</h2>
          <div id="player-board" class="board" aria-label="Your board"></div>
        </div>

        <div class="board-wrap">
          <h2>Enemy Waters</h2>
          <div id="enemy-board" class="board" aria-label="Enemy board"></div>
        </div>

        <div id="enemy-shipyard" class="shipyard">
          <h3>Enemy Fleet</h3>
          <ul id="enemy-shipyard-list" class="shipyard-list"></ul>
        </div>
      </section>

      <!-- Legend + action log -->
      <section class="info">
        <ul class="legend">
          <li><span class="swatch ship"></span> Ship</li>
          <li><span class="swatch hit"></span> Hit</li>
          <li><span class="swatch sunk"></span> Sunk</li>
          <li><span class="swatch miss"></span> Miss</li>
        </ul>
        <div class="log-wrap">
          <h3>Battle Log</h3>
          <ul id="log" class="log"></ul>
        </div>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
